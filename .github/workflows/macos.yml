name: macOS build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          rustc --version
          cargo --version
      - name: Core tests
        run: ./test.sh
      - name: Apple Silicon app
        run: ./build.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "../Task Manager.app" TaskManager-macOS-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TaskManager-macOS-arm64
          path: TaskManager-macOS-arm64.zip
